name: Deploy newsletter Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test subscription and publishing
        run: npm test --prefix services/newsletter
      - name: Apply migrations and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Configure CLOUDFLARE_API_TOKEN or deploy locally with Wrangler."
            exit 1
          fi
          npx --yes wrangler@4.14.4 d1 migrations apply ifuryst-newsletter --remote --config services/newsletter/wrangler.jsonc
          npx --yes wrangler@4.14.4 deploy --config services/newsletter/wrangler.jsonc
